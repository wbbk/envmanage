name: Build macOS App

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swiftc --version
          echo "Host architecture: $(uname -m)"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Build app and DMG
        shell: bash
        run: |
          set -euo pipefail
          export APP_BUILD="$GITHUB_RUN_NUMBER"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag must follow vMAJOR.MINOR.PATCH (for example, v1.2.3)"
              exit 1
            fi
            export APP_VERSION="$version"
          fi
          bash build.sh

      - name: Verify and self-test
        shell: bash
        run: |
          set -euo pipefail
          app="dist/EnvManage.app"
          binary="$app/Contents/MacOS/EnvManage"
          dmg="dist/EnvManage.dmg"
          test -x "$binary"
          test -s "$dmg"
          test -f "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(lipo -archs "$binary")" = "${{ matrix.arch }}"
          hdiutil verify -quiet "$dmg"

          "$binary" --selftest | tee selftest.log
          grep -Fq "SELFTEST_OK" selftest.log
          grep -Fq "失败 0 项" selftest.log

      - name: Prepare downloadable packages
        shell: bash
        run: |
          set -euo pipefail
          mv dist/EnvManage.dmg "dist/EnvManage-${{ matrix.arch }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent dist/EnvManage.app "dist/EnvManage-${{ matrix.arch }}.app.zip"
          (
            cd dist
            shasum -a 256 "EnvManage-${{ matrix.arch }}.dmg" "EnvManage-${{ matrix.arch }}.app.zip" > "SHA256-${{ matrix.arch }}.txt"
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EnvManage-${{ matrix.arch }}
          path: |
            dist/EnvManage-${{ matrix.arch }}.dmg
            dist/EnvManage-${{ matrix.arch }}.app.zip
            dist/SHA256-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: EnvManage-*
          path: release
          merge-multiple: true

      - name: Publish tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release/EnvManage-arm64.dmg
          test -s release/EnvManage-x86_64.dmg
          test -s release/EnvManage-arm64.app.zip
          test -s release/EnvManage-x86_64.app.zip
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
