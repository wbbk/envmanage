name: Build macOS App

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Build architecture (arm64 by default)'
        type: choice
        required: true
        default: arm64
        options:
          - arm64
          - both

permissions:
  contents: read

env:
  # Change this base version when starting development for the next formal release.
  PREVIEW_BASE_VERSION: '1.0.0'

# Avoid spending runner minutes on superseded pushes and PR updates.
# Release tag builds are never cancelled by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Daily CI: ARM64 only. Tags: both architectures. Manual dispatch: ARM64 by default, with an optional both choice.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || inputs.architecture == 'both') && '[{"runner":"macos-26","arch":"arm64"},{"runner":"macos-26-intel","arch":"x86_64"}]' || '[{"runner":"macos-26","arch":"arm64"}]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swiftc --version
          echo "Host architecture: $(uname -m)"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Build app and DMG
        shell: bash
        run: |
          set -euo pipefail
          export APP_BUILD="$GITHUB_RUN_NUMBER"
          export APP_VERSION="$PREVIEW_BASE_VERSION"
          export APP_RELEASE_LABEL="v${APP_VERSION}-beta.${APP_BUILD}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag must follow vMAJOR.MINOR.PATCH (for example, v1.2.3)"
              exit 1
            fi
            export APP_VERSION="$version"
            export APP_RELEASE_LABEL="v$version"
          fi
          bash build.sh

      - name: Verify and self-test
        shell: bash
        run: |
          set -euo pipefail
          app="dist/EnvManage.app"
          binary="$app/Contents/MacOS/EnvManage"
          dmg="dist/EnvManage.dmg"
          test -x "$binary"
          test -s "$dmg"
          test -f "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            expected_label="$GITHUB_REF_NAME"
          else
            expected_label="v${PREVIEW_BASE_VERSION}-beta.${GITHUB_RUN_NUMBER}"
          fi
          actual_label="$(/usr/libexec/PlistBuddy -c 'Print :EnvManageReleaseVersion' "$app/Contents/Info.plist")"
          test "$actual_label" = "$expected_label"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$GITHUB_RUN_NUMBER"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(lipo -archs "$binary")" = "${{ matrix.arch }}"
          hdiutil verify -quiet "$dmg"

          "$binary" --selftest | tee selftest.log
          grep -Fq "SELFTEST_OK" selftest.log
          grep -Fq "失败 0 项" selftest.log

      - name: Prepare downloadable packages
        shell: bash
        run: |
          set -euo pipefail
          mv dist/EnvManage.dmg "dist/EnvManage-${{ matrix.arch }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent dist/EnvManage.app "dist/EnvManage-${{ matrix.arch }}.app.zip"
          (
            cd dist
            shasum -a 256 "EnvManage-${{ matrix.arch }}.dmg" "EnvManage-${{ matrix.arch }}.app.zip" > "SHA256-${{ matrix.arch }}.txt"
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EnvManage-${{ matrix.arch }}
          path: |
            dist/EnvManage-${{ matrix.arch }}.dmg
            dist/EnvManage-${{ matrix.arch }}.app.zip
            dist/SHA256-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    # PRs only validate the build. Main publishes numbered ARM64 beta releases; version tags publish both architectures.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: EnvManage-*
          path: release
          merge-multiple: true

      - name: Generate release notes from Git changes
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          beta_tag="v${PREVIEW_BASE_VERSION}-beta.${GITHUB_RUN_NUMBER}"
          previous="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/continuous" --jq '.object.sha' 2>/dev/null || true)"
          notes="$RUNNER_TEMP/release-notes.md"
          changes="$RUNNER_TEMP/release-commit-messages.txt"
          : > "$changes"

          # Read the commit range since the previous continuous release.
          if [[ "$previous" =~ ^[0-9a-f]{40}$ && "$previous" != "$GITHUB_SHA" ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" > "$RUNNER_TEMP/compare.json"; then
              jq -r '.commits | .[-20:][]? | .commit.message | split("\n")[0] | select(length > 0) | "- " + .' \
                "$RUNNER_TEMP/compare.json" > "$changes"
              count="$(jq '.commits | length' "$RUNNER_TEMP/compare.json")"
              if (( count > 20 )); then
                printf '%s\n' "- 另有 $((count - 20)) 项提交，详见仓库提交历史。" >> "$changes"
              fi
            else
              echo "::warning::Unable to compare release commits; falling back to the current commit message."
            fi
          fi

          if [[ ! -s "$changes" ]]; then
            if [[ "$previous" == "$GITHUB_SHA" ]]; then
              printf '%s\n' "- 本次重新构建，源码无新增提交。" > "$changes"
            else
              latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.message' | head -n 1)"
              printf '%s\n' "- $latest" > "$changes"
            fi
          fi

          {
            printf '**版本：%s**\n\n' "$beta_tag"
            printf '## 本次更新\n\n'
            cat "$changes"
            printf '\n## 安装包\n\n'
            printf '%s\n' '- `EnvManage-arm64.dmg`：Apple Silicon Mac 安装镜像'
            printf '%s\n' '- `EnvManage-arm64.app.zip`：Apple Silicon Mac 应用压缩包'
            printf '%s\n' '- `SHA256-arm64.txt`：安装包校验值'
          } > "$notes"
          cat "$notes"

      - name: Publish numbered ARM64 beta release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${PREVIEW_BASE_VERSION}-beta.${GITHUB_RUN_NUMBER}"
          test -s release/EnvManage-arm64.dmg
          test -s release/EnvManage-arm64.app.zip
          test -s release/SHA256-arm64.txt
          test -s "$RUNNER_TEMP/release-notes.md"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --title "EnvManage $tag（ARM64 测试版）" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* \
              --title "EnvManage $tag（ARM64 测试版）" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --latest=false \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Update continuous release to latest beta
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          beta_tag="v${PREVIEW_BASE_VERSION}-beta.${GITHUB_RUN_NUMBER}"
          title="EnvManage $beta_tag（ARM64 持续测试版）"
          notes="$RUNNER_TEMP/release-notes.md"
          test -s "$notes"
          if gh release view continuous --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload continuous release/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit continuous --title "$title" --notes-file "$notes" --prerelease --repo "$GITHUB_REPOSITORY"
            # Keep the stable continuous URL while advancing its source revision.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/continuous" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create continuous release/* \
              --title "$title" --notes-file "$notes" --prerelease --latest=false \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Prune older beta releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Preserve continuous, formal releases, and the three newest beta versions.
          mapfile -t outdated < <(
            gh release list --limit 100 --json tagName,isPrerelease --repo "$GITHUB_REPOSITORY" \
            | jq -r --arg prefix "v${PREVIEW_BASE_VERSION}-beta." \
                '.[] | select(.isPrerelease and (.tagName | startswith($prefix))) | .tagName' \
            | sort -V | head -n -3
          )
          for previous_tag in "${outdated[@]}"; do
            if ! gh release delete "$previous_tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"; then
              echo "::warning::Could not prune beta release $previous_tag"
            fi
          done

      - name: Publish versioned release (ARM64 + Intel)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release/EnvManage-arm64.dmg
          test -s release/EnvManage-x86_64.dmg
          test -s release/EnvManage-arm64.app.zip
          test -s release/EnvManage-x86_64.app.zip
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

